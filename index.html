<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<link rel="stylesheet" href="omar.css"> 
</head>
<body>

    <!-- 1. الجزء العلوي -->
    <div class="header">
        <h1>Welcome, Omar!</h1>
        <p>Keep up the good work!</p>
    </div>

    <!-- 2. الـ 4 Cards -->
    <div class="cards-container">
        <div class="card math">
            <h3>Math</h3>
            <div class="percentage">90%</div>
            <div class="status">Excellent</div>
        </div>

        <div class="card programming">
            <h3>Programming</h3>
            <div class="percentage">95%</div>
            <div class="status">Outstanding</div>
        </div>

        <div class="card english">
            <h3>English</h3>
            <div class="percentage">85%</div>
            <div class="status">Very Good</div>
        </div>

        <div class="card science">
            <h3>Science</h3>
            <div class="percentage">88%</div>
            <div class="status">Excellent</div>
        </div>
    </div>

</body>
</html>
